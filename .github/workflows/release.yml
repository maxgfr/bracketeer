name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# One release at a time. Two runs racing would both compute the same next
# version from the same tag, and the second would fail on a tag that exists.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # tags, the GitHub release, and the version bump commit
      issues: write # semantic-release comments on the issues a release closes
      pull-requests: write
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          # semantic-release reads the history back to the last tag to work out
          # what changed, so a shallow clone would make every release the first.
          fetch-depth: 0
          persist-credentials: true

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # The runner's Node 22 ships npm 10, which predates trusted publishing.
      # semantic-release exchanges the OIDC token itself and succeeds, then hands
      # off to `npm publish` — which, on npm 10, does not know what to do with the
      # credential and stops at ENEEDAUTH. That failure lands *after* the tag and
      # the version commit are pushed, so it leaves a release nobody can install.
      - name: Use an npm that understands trusted publishing
        run: |
          npm install -g npm@^11.5.1
          npm --version

      - run: pnpm install --frozen-lockfile

      # Nothing gets published that would not have passed CI. The build runs
      # again inside the release, after the version has been written.
      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Engine coverage
        run: pnpm --filter @bracketeer/engine test:coverage

      - name: App coverage
        run: pnpm --filter @bracketeer/web test:coverage

      - name: Presets coverage
        run: pnpm --filter @bracketeer/presets test:coverage

      - name: CLI coverage
        run: pnpm --filter bracketeer-cli test:coverage

      - name: Build the site
        run: pnpm build

      # No npm token. The package uses npm trusted publishing, so
      # @semantic-release/npm exchanges this job's OIDC token for a short-lived
      # credential — which is why `id-token: write` above is not optional.
      #
      # Passing an empty NPM_TOKEN here would be worse than passing none: the
      # plugin would see a token, take the token path, and fail EINVALIDNPMTOKEN
      # without ever attempting the exchange.
      #
      # The trusted publisher on npmjs.com is keyed to the repository *and the
      # workflow filename*, so this file cannot be renamed without updating it.
      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm release

      # semantic-release pushes the tag and the version commit *before* it
      # publishes, so a publish that fails leaves the repository claiming a
      # version the registry has never heard of. This undoes exactly that, and
      # only that: if the version did reach npm, the failure was somewhere
      # harmless afterwards and the tag must stay.
      - name: Undo a tag whose version never reached npm
        if: failure() && steps.release.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./packages/cli/package.json').version")
          tag="v$version"

          if ! git rev-parse "$tag" >/dev/null 2>&1; then
            echo "No $tag was created — nothing to undo."
            exit 0
          fi

          if npm view "bracketeer-cli@$version" version >/dev/null 2>&1; then
            echo "$version is on npm; the tag is correct and stays."
            exit 0
          fi

          echo "$version was tagged but never published. Removing $tag."
          git push --delete origin "$tag"
          git tag -d "$tag" || true

          # Put the version back so the next run computes the same number and
          # publishes it for real, rather than skipping it as already released.
          if git log -1 --pretty=%s | grep -q "^chore(release): $version"; then
            git revert --no-edit HEAD
            git push origin HEAD:main
          fi

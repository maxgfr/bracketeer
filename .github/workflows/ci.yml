name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # The engine is the part that has to be right: a wrong bracket is
      # discovered by twenty people standing on gravel, not by a stack trace.
      - name: Engine coverage
        run: pnpm --filter @bracketeer/engine test:coverage

      - name: App coverage
        run: pnpm --filter @bracketeer/web test:coverage

      - name: Build
        run: pnpm build

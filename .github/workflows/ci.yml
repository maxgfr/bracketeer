name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Commit messages decide the next version number, so a message that says
  # nothing releases nothing — silently. Better to fail here than to wonder
  # later why a fix never shipped.
  commits:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint commit messages
        run: >
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # The engine is the part that has to be right: a wrong bracket is
      # discovered by twenty people standing on gravel, not by a stack trace.
      - name: Engine coverage
        run: pnpm --filter @bracketeer/engine test:coverage

      - name: App coverage
        run: pnpm --filter @bracketeer/web test:coverage

      - name: Presets coverage
        run: pnpm --filter @bracketeer/presets test:coverage

      - name: CLI coverage
        run: pnpm --filter bracketeer-cli test:coverage

      - name: Build
        run: pnpm build

      # The one claim the unit tests structurally cannot make: what a stranger
      # sees when they open a share link. Runs against the built bundle, under
      # the real base path, in the Chrome the runner already has.
      - name: Browser tests
        run: pnpm --filter @bracketeer/web test:e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

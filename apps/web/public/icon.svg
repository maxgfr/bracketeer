<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Bracketeer">
  <!--
    The mark is a bracket drawn as the app draws one: two fixtures resolving into
    a third, in the same hairline rules and signal red the interface uses.
  -->
  <rect width="64" height="64" fill="#fbfbfc"/>
  <g fill="none" stroke="#20232c" stroke-width="3" stroke-linecap="square">
    <path d="M10 18 H24 V32 H34"/>
    <path d="M10 46 H24 V32"/>
  </g>
  <rect x="34" y="26" width="20" height="12" fill="#d63b1f"/>
</svg>

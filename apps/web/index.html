  <body>
    <!--
      DIRECTION CONTRACT

      THESIS: A tournament is a published result, not a dashboard. This surface is the
      results wall a federation prints — ruled rows of figures you read at a glance —
      and it refuses both category defaults: the navy-and-neon esports skin and the
      white-card SaaS dashboard.

      OWN-WORLD: Cool newsprint ground, printing-ink near-black, one pure signal red
      reserved for what is live or needs a score. Structure is rules, never cards:
      hairlines between rows, a heavy rule under every section head. Tabular figures
      in a monospaced column, right-aligned, so numbers stack and compare.

      STORY: An organiser standing on gravel sees which court is waiting, taps two
      numbers, and the next round is drawn. A spectator opens the same link and reads
      the table.

      FIRST VIEWPORT: Masthead rule with the tournament's name and round; immediately
      below, the fixtures that need a score, largest type on the page, each row a
      touch target. Standings sit under a second rule. Primary action is the score
      field itself — there is no button to hunt for.

      FORM: Sports information design (results service). Ranked first of three derived
      directions; chosen by the user over the official-draw-sheet alternate and the
      played-straight category standard.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
